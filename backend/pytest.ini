[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths = tests
pythonpath = . app
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: Fast unit tests without network or db
    integration: Integration tests for API endpoints and services
    e2e: End-to-end simulation tests
    slow: Tests that execute complex simulation pipelines
