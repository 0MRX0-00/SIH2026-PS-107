services:
  # ----------------------------------------------------------------------------
  # e-BIS Sahayak — Unified Full-Stack Service (Next.js Frontend + FastAPI Backend)
  # ----------------------------------------------------------------------------
  - type: web
    name: sih2026-ps-107
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: NEXT_PUBLIC_APP_NAME
        value: e-BIS Sahayak
